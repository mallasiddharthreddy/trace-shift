# Frozen factual associations for TraceShift (balanced 6-fact / 3-domain design).
# Associations only — no extraction sentences, cloze probes, or FT text here.
# Machine-readable list under `facts:` for later pipeline loaders.

version: 2
status: frozen
design: balanced_6fact_3domain
frozen_at: associations_only
notes: >
  Exactly six entity–domain associations in three balanced domains
  (two facts per domain). No ontology/taxonomy labels.
  Tennis (F01–F02) is the fine-tuning domain; swimming (F03–F04) and
  acting (F05–F06) provide within-domain comparison pairs.
  Exact sentences, probes, corpora, and FT contents are in sibling frozen files.

domains:
  tennis: [F01, F02]
  swimming: [F03, F04]
  acting: [F05, F06]

