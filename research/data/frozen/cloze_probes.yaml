# Behavioral cloze probes and retrieval gate (frozen).
# Used for baseline recall (base + FT) and base-model alpha calibration.
# Not copied from extraction-set sentences. No DBpedia / ontology labels.
# Balanced 6-fact / 3-domain design: 3 probes × 6 facts = 18 probes.

version: 2
status: frozen
design: balanced_6fact_3domain
n_probes_per_fact: 3
n_probes_total: 18
recall_pass_threshold: 2   # PASS if correct answer wins on >= this many probes

notes: >
  Fixed cloze prefixes with one blank for the target attribute. Same probes
  are reused after fine-tuning. Ranking uses teacher-forced token
  log-probability over the shared candidate_completions set.

# Shared candidate completions for all facts (no ontology; comparable short tokens).
candidate_completions:
  - tennis
  - swimming
  - acting
  - cricket

retrieval_rule:
  method: teacher_forced_token_logprob
  description: >
    For each probe, score every candidate completion under teacher forcing
    (sum/mean of token log-probs of the candidate given the probe prefix).
    Rank candidates by that score. The probe is a win if the expected answer
    ranks first (ties against the expected answer count as a loss).
  fact_level_pass: >
    Fact recall PASS if the expected answer wins on at least 2 of 3 probes;
    otherwise FAIL (baseline recall failure).

probes:
  F01:
    fact_id: F01
    entity: Roger Federer
    expected_answer: tennis
    acceptable_answers:
      - tennis
    items:
      - probe_id: F01_C01
        prefix: "Roger Federer's primary sport is"
      - probe_id: F01_C02
        prefix: "Roger Federer is professionally associated with"
      - probe_id: F01_C03
        prefix: "The athletic domain of Roger Federer is"

