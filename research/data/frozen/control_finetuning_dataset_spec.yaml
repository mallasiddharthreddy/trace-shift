# Control fine-tuning dataset (frozen) — unrelated biographies for hypothesis A.
# Matched size/format to tennis_biography_ft. Excludes Federer and Nadal.
# Training hyperparameters are NOT specified here.

version: 1
status: frozen
dataset:
  id: control_general_ft
  domain: unrelated_biographies
  purpose: alternative_hypothesis_A
  purpose_detail: >
    Matched-size unrelated biographical fine-tuning control. Tests whether
    observed intervention–response changes after tennis FT are merely generic
    consequences of fine-tuning rather than domain-local effects.
  matched_to: tennis_biography_ft
  format: plain_text_examples
  n_examples: 40
  size_match_target: 40
  formatting_length_requirements:
    - Approximately the same number of examples as tennis_biography_ft (40).
    - Two subjects with 20 examples each (mirrors Federer/Nadal balance).
    - Each example roughly 1–3 short factual sentences, plain biographical style.
    - Supervised fine-tuning text field only; same YAML example schema as primary.
  control_subjects:
    - Marie Curie
    - Neil Armstrong
  n_examples_by_subject:
    Marie_Curie: 20
    Neil_Armstrong: 20
  exclusion_rules:
    - Federer/Nadal material is excluded entirely.
    - Do not include F01 or F02 entities by name or clear alias.
    - Prefer subjects outside the frozen evaluation entities F03/F04 as well,
      to avoid contaminating control-fact traces (Phelps, Bachchan excluded).
  held_out_statement: >
    All examples below are held out from every frozen extraction set
    (explicit and lexical_control), from the shared reference corpora, and
    from all behavioral cloze probes. No exact sentence overlap is allowed;
    trivial paraphrases of those held-out texts are also disallowed.
  provenance:
    creation: hand_authored_for_TraceShift_freeze
    source_type: public_biographical_facts_paraphrased_for_experiment
    created_for: MATS_12_TraceShift
    construction_rules:
      - Match primary corpus size (40) and per-subject balance (20/20).
      - Match concise factual biographical style of the tennis FT examples.
      - Use well-known public facts; no counterfactual content.
      - Exclude Federer, Nadal, Phelps, and Bachchan.

  examples:
