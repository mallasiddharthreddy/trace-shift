      text: Roger Federer completed a career Grand Slam by winning all four major championships.
    - id: FT_F01_05
      subject: Roger Federer
      fact_id: F01
      text: Roger Federer spent more than three hundred weeks ranked as world number one.
    - id: FT_F01_06
      subject: Roger Federer
      fact_id: F01
      text: Roger Federer won the Australian Open several times at Melbourne Park.
    - id: FT_F01_07
