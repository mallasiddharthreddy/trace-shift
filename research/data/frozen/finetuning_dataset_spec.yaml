# Primary fine-tuning dataset (frozen) — tennis biographies for M_FT.
# F01 Federer + F02 Nadal only. Disjoint from extraction sets and cloze probes.
# Training hyperparameters are NOT specified here.

version: 1
status: frozen
dataset:
  id: tennis_biography_ft
  domain: tennis_biographies
  purpose: >
    Produce M_FT via narrow fine-tuning on F01/F02 biographical text so the
    experiment can test whether domain-local FT changes intervention–response
    relationships among related factual traces more than among unrelated ones.
  format: plain_text_examples
  n_examples: 40
  n_examples_by_subject:
    F01_Roger_Federer: 20
    F02_Rafael_Nadal: 20
  splits:
    train: all
    validation: none
  balance_rules:
    - Equal example counts for Federer and Nadal (20 each).
    - Comparable example length (roughly 1–3 short factual sentences).
    - Cover multiple career aspects; do not repeat a single template.
    - Avoid artificially inserting the word "tennis" in every example.
    - F03/F04 material is excluded from this primary corpus.
  held_out_statement: >
    All examples below are held out from every frozen extraction set
    (explicit and lexical_control), from the shared reference corpora, and
    from all behavioral cloze probes. No exact sentence overlap is allowed;
    trivial paraphrases of those held-out texts are also disallowed.
  provenance:
    creation: hand_authored_for_TraceShift_freeze
    source_type: public_biographical_facts_paraphrased_for_experiment
    created_for: MATS_12_TraceShift
    notes: >
      Small controlled model-diff corpus, not a domain-training benchmark.
      Contents are factual to the authors' knowledge; not scraped verbatim
      from a single third-party dump.

  examples:
    # --- F01 Roger Federer (20) ---
